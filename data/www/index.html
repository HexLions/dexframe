<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DexFrame</title>
<style>
@font-face{font-family:Silkscreen;src:url(fonts/Silkscreen-Regular.ttf) format("truetype");font-weight:400;font-display:block}
@font-face{font-family:Silkscreen;src:url(fonts/Silkscreen-Bold.ttf) format("truetype");font-weight:700;font-display:block}
:root{--bg:#f4f4f2;--fg:#1b1b1b;--muted:#666;--card:#fff;--line:#ddd;--acc:#2a6fdb}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#eee;--muted:#999;--card:#1e1e1e;--line:#333;--acc:#5b93f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:1240px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.layout>*{min-width:0}
@media (min-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .layout .preview{position:sticky;top:12px;margin-bottom:0}
}
.sections{display:flex;gap:6px;flex-wrap:wrap;padding:8px 2px;margin-bottom:4px;
  position:sticky;top:0;z-index:2;background:var(--bg)}
.sections button{flex:none;white-space:nowrap}
.sections button[aria-current=page]{background:var(--acc);color:#fff;border-color:var(--acc)}
#form fieldset{display:none}
#form fieldset.active{display:block}
h1{font:700 20px Silkscreen,monospace;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.lang{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.preview{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px}
#out{width:100%;max-width:800px;aspect-ratio:4/3;image-rendering:pixelated;display:block;margin:0 auto;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:10px;background:var(--card)}
legend{font-weight:600;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.wide{grid-column:1/-1}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
label.chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--fg)}
input,select,button,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0}
textarea{min-height:9em;resize:vertical}
button{cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
#status{font-size:13px;color:var(--muted)}
.picker{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.picker .bar{display:flex;gap:8px;flex-wrap:wrap}
.picker .bar input[type=search]{flex:1;min-width:180px}
.picker .bar label.chk{flex:none;font-size:13px}
.picker .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:340px;overflow:auto;padding:2px}
.picker .it{display:flex;align-items:center;gap:8px;text-align:left;padding:4px 6px;font-size:13px;line-height:1.2}
.picker .it img{width:40px;height:40px;image-rendering:pixelated;background:#fff;border-radius:4px;flex:none}
.picker .it small{display:block;color:var(--muted);font-size:11px}
.picker .it.on{outline:2px solid var(--acc)}
.picker .count{font-size:12px;color:var(--muted)}
.sel{display:flex;flex-direction:column;gap:6px}
.sel h4{margin:0;font-size:13px;font-weight:600}
.sel .empty{font-size:13px;color:var(--muted)}
.sel .row{display:flex;align-items:center;gap:8px;margin:0;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sel .row img{width:40px;height:40px;image-rendering:pixelated;background:#fff;border-radius:4px;flex:none}
.sel .row input{flex:1;min-width:0}
.sel .row button{padding:4px 8px;flex:none}
.trbox{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.trbox .cur{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trbox .cur img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;background:#fff;border:1px solid var(--line);border-radius:6px}
.trbox .cur span{font-size:13px;color:var(--muted);flex:1;min-width:140px}
.trbox .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.trbox .res button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;font-size:11px;line-height:1.2}
.trbox .res img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;background:#fff;border-radius:4px}
.trbox .res button.on{outline:2px solid var(--acc)}
details.adv{grid-column:1/-1;margin-top:4px}
details.adv summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.adv .grid{margin-top:8px}
.coll{display:flex;flex-direction:column;gap:6px}
.coll .card{display:flex;align-items:center;gap:8px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);flex-wrap:wrap}
.coll .card img{width:40px;height:30px;image-rendering:pixelated;flex:none}
.coll .card span{flex:1;min-width:120px;font-size:13px}
.coll .card button{padding:4px 8px}
.trbox textarea{min-height:12em;font:13px/1.35 ui-monospace,monospace}
.muted{font-size:12px;color:var(--muted)}
.pglist{display:flex;flex-direction:column;gap:4px}
.pgrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.pgrow label{flex:1;min-width:0}
.pgrow input[type=number]{width:72px;flex:none}
.pgrow button{padding:4px 8px;flex:none}
#pagesbox{margin-bottom:10px}
.frgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.frtile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px;font-size:11px;line-height:1.2}
.frtile canvas{width:120px;height:76px;image-rendering:pixelated;border-radius:3px;border:1px solid var(--line)}
.frtile[aria-pressed=true]{outline:2px solid var(--acc)}
.btnlike{display:inline-block;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px;color:var(--fg)}
.batline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.batgauge{width:64px;height:20px;border:2px solid var(--fg);border-radius:4px;padding:2px;position:relative}
.batgauge::after{content:'';position:absolute;right:-6px;top:5px;width:3px;height:6px;background:var(--fg);border-radius:0 2px 2px 0}
.batgauge i{display:block;height:100%;background:var(--acc);border-radius:1px;width:0}
.batgauge i[data-low="1"]{background:#d33}
#dlInfo{white-space:pre-line}
.pgrow select{max-width:9.5em;min-width:0}
.pgrow{flex-wrap:wrap}
.pgrow label{flex:1 1 140px}
#syInfo{white-space:pre-line}
</style>
</head>

<main>
  <header class="top"><h1>DexFrame</h1>
    <label class="lang"><span id="uiLangLabel"></span> <select id="uiLang"></select></label></header>
  <div class="layout">
  <section class="preview">
    <div class="tabs" id="tabs"></div>
    <canvas id="out" width="400" height="300"></canvas>
    <div class="row">
      <button class="primary" id="send" data-i18n="send"></button>
      <button id="next" data-i18n="next"></button>
      <button id="show" data-i18n="show_dev"></button>
      <button id="save" data-i18n="save"></button>
      <button id="autofill" data-i18n="autofill"></button>
      <button id="png" data-i18n="png"></button>
      <span id="status">…</span>
    </div>
  </section>
  <div class="editor">
    <nav class="sections" id="sections"></nav>
    <form id="form" autocomplete="off"></form>
  </div>
  </div>
</main>

const W = 400, H = 300, PLANE = W * H / 8;

// Inks, by global code (the same numbers the firmware uses, see include/frame_codec.h).
// rgb: how the ink looks (preview, colour matching); css: the pure colour pages draw
// with on the work canvas, which canvasToInk() turns back into the ink code.
const INKS = [
  {name: 'white', rgb: [255, 255, 255], css: '#fff'}, {name: 'black', rgb: [17, 17, 17], css: '#000'},
  {name: 'red', rgb: [200, 30, 30], css: '#f00'}, {name: 'yellow', rgb: [236, 196, 20], css: '#ff0'},
  {name: 'blue', rgb: [30, 70, 180], css: '#00f'}, {name: 'green', rgb: [40, 130, 60], css: '#0f0'},
  {name: 'orange', rgb: [225, 120, 30], css: '#f80'}];
const inkCode = name => INKS.findIndex(k => k.name === name);
// Panels this page knows; a connected board describes its own in /api/info.
const PANELS = {
  bw: {palette: ['white', 'black']},
  bwr: {palette: ['white', 'black', 'red']},
  bwry: {palette: ['white', 'black', 'red', 'yellow']},
  color6: {palette: ['white', 'black', 'red', 'yellow', 'blue', 'green'], previewOnly: true}};   // no firmware build yet
const panelOf = s => PANELS[s.panel] || PANELS.bw;
const hasInk = (s, name) => panelOf(s).palette.includes(name);
const isColour = s => panelOf(s).palette.length > 3;      // yellow and beyond: coloured sprites and type colours
const accent = s => hasInk(s, 'red') ? '#f00' : '#000';
// Bits per pixel of a frame for a palette: enough for its highest ink code.
const paletteBpp = pal => { const top = Math.max(...pal.map(n => INKS.findIndex(k => k.name === n))); return top > 3 ? 3 : top > 1 ? 2 : 1; };

// e-paper shows. Add a language by adding a block to LANGS, UI, DISP and TYPE_NAMES.

const fill = (str, vars = {}) => String(str).replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);

const typeName = (k, lang = state.dispLang) => (TYPE_NAMES[lang] || TYPE_NAMES.en)[k] || k || '';
// Accepts a key or a type name in any language (data saved before i18n stored Italian names).
function typeKey(v) {
  if (!v) return '';
  if (TYPE_KEYS.includes(v)) return v;
  const low = String(v).toLowerCase();
  for (const names of Object.values(TYPE_NAMES))
    for (const [k, n] of Object.entries(names)) if (n.toLowerCase() === low) return k;
  return '';
}

const PA_RAW = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/';
const SPRITES = {
  rb:      {path: 'generation-i/red-blue/transparent', max: 151, gen: 1, shiny: false},
  yellow:  {path: 'generation-i/yellow/transparent', max: 151, gen: 1, shiny: false},
  gold:    {path: 'generation-ii/gold/transparent', max: 251, gen: 2, shiny: 'transparent/shiny'},

  bw:      {path: 'generation-v/black-white', max: 649, gen: 5},
};
function spriteUrl(style, id, shiny) {
  const sp = SPRITES[style] || SPRITES.pt;
  if (id > sp.max) return `${PA_RAW}pokemon/${shiny ? 'shiny/' : ''}${id}.png`;
  // Gen 2 shiny sprites live in <game>/transparent/shiny; Gen 1 has none
  const dir = shiny && sp.shiny !== false ? (sp.shiny ? sp.path.replace(/\/transparent$/, '/' + sp.shiny) : sp.path + '/shiny') : sp.path;
  return `${PA_RAW}pokemon/versions/${dir}/${id}.png`;
}

function buildForm() {
  const form = $('form');
  form.innerHTML = '';
  for (const [gid, fields] of GROUPS) {
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend'); lg.textContent = t('g_' + gid); fs.append(lg);
    fs.dataset.group = gid;
    const grid = document.createElement('div'); grid.className = 'grid';
    let advGrid = null;
    for (const [key, labelKey, type = 'text', opts] of fields) {
      const label = Array.isArray(labelKey) ? t(...labelKey) : t(labelKey);
      const lab = document.createElement('label');
      let el;
      if (type === 'select') {
        el = document.createElement('select');
        for (const [v, txt] of opts()) el.add(new Option(txt, v));
        el.value = state[key];
      } else if (type === 'textarea') {
        el = document.createElement('textarea');
        el.value = state[key] ?? '';
        lab.className = 'wide';
      } else {
        el = document.createElement('input');
        el.type = type;

// A list line is "file.png", "Name | file.png" or just "Name".
function parseRibbonLine(line) {

// Candidates, first hit wins:

//   ribbons.json mapping, ./ribbons/<slug>.png, then <slug>.png at URL base
async function ribbonImage({name, file}) {

// Shrink a large image to fit `max` px by averaging f x f blocks (alpha-weighted),
// so a 256px PNG becomes a clean small pixel icon instead of a resampled blur.
function fitPixels(sp, max) {
  if (Math.max(sp.w, sp.h) <= max) return sp;
  const f = Math.ceil(Math.max(sp.w, sp.h) / max);
  const w = Math.ceil(sp.w / f), h = Math.ceil(sp.h / f);
  const out = new Uint8ClampedArray(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let r = 0, g = 0, b = 0, a = 0, cnt = 0;
    for (let j = 0; j < f; j++) for (let i = 0; i < f; i++) {
      const sx = x * f + i, sy = y * f + j;
      if (sx >= sp.w || sy >= sp.h) continue;
      const [pr, pg, pb, pa] = sp.at(sx, sy);
      r += pr * pa; g += pg * pa; b += pb * pa; a += pa; cnt++;
    }
    const o = (y * w + x) * 4;
    if (a > 0) { out[o] = r / a; out[o + 1] = g / a; out[o + 2] = b / a; }
    out[o + 3] = cnt ? a / cnt : 0;
  }
  return {w, h, at: (x, y) => { const o = (y * w + x) * 4; return [out[o], out[o + 1], out[o + 2], out[o + 3]]; }};
}

// ---------- drawing primitives ----------
const FONT = (px, bold) => `${bold ? '700' : '400'} ${px}px Silkscreen, monospace`;
const BLACK = '#000', WHITE = '#fff';

// Text as hard 1-bit pixels (no anti-aliasing) so it survives quantization in
// either polarity. If it doesn't fit maxW at `px`, it steps down to 8px.
const textCanvas = document.createElement('canvas');
// Silkscreen Bold draws "#" and "4" as blobs at 1 bit: in bold text those two use the
// regular glyph (struck twice, 1 px apart, from 16 px), centred in the bold advance.
const BOLD_FIX = /[#4]/;
function text(ctx, str, x, y, px, bold, color, align = 'left', maxW = Infinity) {
  const tc = textCanvas.getContext('2d', {willReadFrequently: true});
  str = String(str);
  tc.font = FONT(px, bold);
  let tw = Math.ceil(tc.measureText(str).width);
  if (tw > maxW && px > 8) {
    y += Math.round((px - 8) / 2); px = 8; tc.font = FONT(px, bold);
    tw = Math.ceil(tc.measureText(str).width);
  }
  textCanvas.width = tw + 4; textCanvas.height = px * 2;
  tc.font = FONT(px, bold); tc.textBaseline = 'top'; tc.fillStyle = '#000';
  if (bold && BOLD_FIX.test(str)) {
    let cx = 2;
    for (const c of str) {
      tc.font = FONT(px, true);
      const adv = tc.measureText(c).width;
      if (BOLD_FIX.test(c)) {
        tc.font = FONT(px, false);
        const off = Math.round(cx + (adv - tc.measureText(c).width - 1) / 2);
        tc.fillText(c, off, 0);
        if (px >= 16) tc.fillText(c, off + 1, 0);   // at 8 px the plain glyph is already heavy enough
      } else tc.fillText(c, cx, 0);
      cx += adv;
    }
  } else tc.fillText(str, 2, 0);
  const d = tc.getImageData(0, 0, textCanvas.width, textCanvas.height).data;
  const x0 = Math.round(align === 'right' ? x - tw : align === 'center' ? x - tw / 2 : x) - 2;
  ctx.fillStyle = color;
  for (let j = 0; j < textCanvas.height; j++) for (let i = 0; i < textCanvas.width; i++)
    if (d[(j * textCanvas.width + i) * 4 + 3] >= 60) ctx.fillRect(x0 + i, y + j, 1, 1);
  return tw;
}

// Split at the last space that fits maxW; returns 1 or 2 lines.
function wrap(str, px, bold, maxW) {
  const tc = textCanvas.getContext('2d');
  tc.font = FONT(px, bold);
  if (tc.measureText(str).width <= maxW) return [str];
  const words = str.split(' ');
  for (let k = words.length - 1; k > 0; k--) {
    const a = words.slice(0, k).join(' '), b = words.slice(k).join(' ');
    if (tc.measureText(a).width <= maxW && tc.measureText(b).width <= maxW) return [a, b];
  }
  return [str];   // can't wrap cleanly: caller falls back to 8px
}

function box(ctx, x, y, w, h, filled, color = BLACK) {
  ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
  if (!filled) { ctx.fillStyle = WHITE; ctx.fillRect(x + 1, y + 1, w - 2, h - 2); }
}

function drawGender(ctx, x, y, g, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x + 4, y + 7, 4, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  if (g === 'M') { ctx.moveTo(x + 7, y + 4); ctx.lineTo(x + 11, y); ctx.moveTo(x + 7, y); ctx.lineTo(x + 11, y); ctx.lineTo(x + 11, y + 4); }
  else if (g === 'F') { ctx.moveTo(x + 4, y + 11); ctx.lineTo(x + 4, y + 17); ctx.moveTo(x + 1, y + 14); ctx.lineTo(x + 7, y + 14); }
  ctx.stroke();
}

// Original generic rosette glyph (not a game asset): 12x15.
function ribbonIcon(ctx, x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x + 2, y, 8, 10); ctx.fillRect(x, y + 2, 12, 6);       // rosette
  ctx.fillRect(x + 2, y + 10, 3, 5); ctx.fillRect(x + 7, y + 10, 3, 5); // tails
  ctx.fillStyle = WHITE; ctx.fillRect(x + 4, y + 3, 4, 4);               // centre
}

// Original generic trainer silhouette (not a game asset), drawn into box w x h.
function silhouette(ctx, x, y, w, h, color) {
  const cx = x + w / 2, u = Math.floor(Math.min(w / 7, h / 12));   // 11u tall, 6.4u wide
  ctx.fillStyle = color;
  ctx.fillRect(cx - 2 * u, y + h - 10 * u, 4 * u, u);            // cap brim
  ctx.fillRect(cx - 1.5 * u, y + h - 11 * u, 3 * u, u);          // cap
  ctx.fillRect(cx - 1.5 * u, y + h - 9 * u, 3 * u, 2.5 * u);     // head
  ctx.fillRect(cx - 2.5 * u, y + h - 6.5 * u, 5 * u, 3.5 * u);   // torso
  ctx.fillRect(cx - 3.2 * u, y + h - 6.2 * u, 0.7 * u, 3 * u);   // arms
  ctx.fillRect(cx + 2.5 * u, y + h - 6.2 * u, 0.7 * u, 3 * u);
  ctx.fillRect(cx - 2 * u, y + h - 3 * u, 1.6 * u, 3 * u);       // legs
  ctx.fillRect(cx + 0.4 * u, y + h - 3 * u, 1.6 * u, 3 * u);
}

// Original Hall of Fame backdrop: light rays from below + a few stars, as faint dither.
function raysBackdrop(ink, y0, strength, protect) {
  const cx = W / 2, cy = H + 40;
  const inProt = (x, y) => protect.some(([rx, ry, rw, rh]) => x >= rx && x < rx + rw && y >= ry && y < ry + rh);
  for (let y = y0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (ink[i] || inProt(x, y)) continue;
    const a = Math.atan2(cy - y, x - cx);               // angle of the ray
    const ray = Math.floor(a * 14 / Math.PI) % 2 === 0;
    const fade = (H - y) / (H - y0);                    // lighter towards the top
    const dark = (ray ? 0.55 : 0.12) * (1 - 0.6 * fade) * strength;
    if (dark > (BAYER[4][y & 3][x & 3] + 0.5) / 16) ink[i] = 1;
  }
  for (const [sx, sy] of [[34, 60], [366, 52], [70, 150], [330, 140], [200, 44]]) {   // stars
    for (let k = -3; k <= 3; k++) {
      for (const [x, y] of [[sx + k, sy], [sx, sy + k]]) if (!inProt(x, y)) ink[y * W + x] = 1;
    }
  }
}

// Thickness of the frame of the page being drawn (26-frames.js): the page dots sit above it.
let chromeFrameT = 0;
const setFrameForChrome = t => { chromeFrameT = t; };

// Shared chrome: header with name + page title, page dots at the bottom.
// Header styles: classic = black bar, accent = bar in the accent ink, light = white bar
// with a rule, tab = black tab behind the name only, boxed = outlined white bar.
function chrome(ctx, s, title, idx, total, name = s.name, gender = s.gender) {
  ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
  const st = PAGE_STYLES.includes(s.pageStyle) ? s.pageStyle : 'classic';
  const barFg = st === 'classic' || st === 'accent';
  ctx.fillStyle = st === 'accent' ? accent(s) : BLACK;
  if (barFg) ctx.fillRect(0, 0, W, 30);
  else if (st === 'boxed') { box(ctx, 0, 0, W, 30, false); ctx.fillStyle = BLACK; ctx.fillRect(0, 28, W, 2); }
  else ctx.fillRect(0, 28, W, 2);
  const titleW = title ? measure(up(title), 8, true) : 0;
  const nameMax = W - titleW - 50;
  if (st === 'tab') {      // tab sized to the name, with a slanted end
    const tw = Math.min(nameMax, measure(up(name), 16, true)) + (gender && gender !== '-' ? 22 : 0) + 20;
    ctx.fillStyle = BLACK; ctx.fillRect(0, 0, tw, 30);
    for (let k = 0; k < 14; k++) ctx.fillRect(tw + k, 2 * k + 2, 1, 28 - 2 * k);
  }
  const fg = barFg || st === 'tab' ? WHITE : BLACK;
  if (title) text(ctx, up(title), W - 10, 11, 8, true, st === 'tab' ? BLACK : fg, 'right');
  const nw = text(ctx, up(name), 10, 7, 16, true, fg, 'left', nameMax);
  if (gender && gender !== '-') drawGender(ctx, 10 + nw + 8, 8, gender, fg);
  const dotsX = W / 2 - (total * 12 - 4) / 2;
  const dotsY = Math.min(288, H - chromeFrameT - 10);
  for (let i = 0; i < total; i++) box(ctx, dotsX + i * 12, dotsY, 8, 8, i === idx);
}

// label (8px) above value (16px)
function field(ctx, label, value, x, y, maxW, color = BLACK) {
  text(ctx, up(label), x, y, 8, true, color);
  text(ctx, up(value || '—'), x, y + 12, 16, false, BLACK, 'left', maxW);
}

function measure(str, px, bold) {
  const tc = textCanvas.getContext('2d'); tc.font = FONT(px, bold);
  return Math.ceil(tc.measureText(String(str)).width);
}
// Greedy word wrap into as many lines as needed.
function wrapLines(str, px, bold, maxW) {
  const lines = []; let cur = '';
  for (const w of String(str).split(/\s+/).filter(Boolean)) {
    const next = cur ? cur + ' ' + w : w;
    if (cur && measure(next, px, bold) > maxW) { lines.push(cur); cur = w; } else cur = next;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ---------- page frames ----------
// Borders drawn around the whole page after everything else. All original, geometric
// designs made in code (no game assets); "custom" is a 9-slice image the user uploads,
// kept in the saved data like the other uploaded images. Thickness is at most 8 px:
// page content keeps 10 px from the sides, the page dots move up to make room.
const PAGE_STYLES = ['classic', 'accent', 'light', 'tab', 'boxed'];
const FRAME_T = {none: 0, line: 3, double: 5, rounded: 5, accent: 5, dashed: 5, chamfer: 6, checker: 6, studs: 6, wave: 6};
const FRAME_KEYS = [...Object.keys(FRAME_T), 'custom'];
const frameOptions = () => FRAME_KEYS.filter(k => k !== 'custom' || state.frameImg).map(k => [k, t('fr_' + k)]);
const frameOf = (s, key) => {
  const f = (s.pageFrame || {})[key] || s.frame || 'none';
  return f === 'custom' && !s.frameImg ? 'none' : FRAME_KEYS.includes(f) ? f : 'none';
};
const frameThickness = (s, key) => {
  const f = frameOf(s, key);
  return f === 'custom' ? Math.min(8, Number(s.frameSlice) || 0) : FRAME_T[f] || 0;
};

// Ink for one pixel of the band. d = distance from the outer edge (0 = outermost),
// along = position along the edge, cx/cy = distance from the nearest corner on each axis.
function framePixel(style, d, along, cx, cy, x, y, acc, hasAcc) {
  const mid = hasAcc ? acc : ((x + y) & 1);     // accent ink, or a 50 % checker on B/W
  switch (style) {
    case 'line': return d < 2 ? 1 : 0;
    case 'double': return d < 2 || d === 3 ? 1 : 0;
    case 'rounded': {
      const r = 9;
      if (cx < r && cy < r) {                    // round the corner: distance from the arc
        const dd = r - Math.hypot(r - cx - 0.5, r - cy - 0.5);
        if (dd < 0) return 0;
        d = Math.floor(dd);
      }
      return d < 2 || d === 3 ? 1 : 0;
    }
    case 'accent': return d === 0 || d === 3 ? 1 : d < 3 ? mid : 0;
    case 'dashed': return d < 2 ? (Math.floor(along / 6) % 2 === 0 || (cx < 6 && cy < 6) ? 1 : 0) : d === 3 ? 1 : 0;
    case 'chamfer': {
      if (cx + cy < 4) return 0;                 // cut corners
      if (cx + cy === 4) return 1;
      return d === 0 || d === 2 || d === 3 || d === 5 ? 1 : 0;
    }
    case 'checker': return d === 0 || d === 4 ? 1 : d < 4 ? ((x >> 1) + (y >> 1)) & 1 : 0;
    case 'studs': {
      const stud = (cx < 6 && cy < 6) || Math.abs(along - (cx < cy ? H : W) / 2) < 4;
      if (stud) return (d === 2 || d === 3) && (cx < 6 && cy < 6 ? (cx === 2 || cx === 3) && (cy === 2 || cy === 3) : true) ? 0 : hasAcc && d > 0 && d < 5 ? acc : 1;
      return d < 2 || d === 3 ? 1 : 0;
    }
    case 'wave': {
      if (cx < 6 && cy < 6) return Math.abs(cx - 2.5) + Math.abs(cy - 2.5) <= 2.6 ? (hasAcc ? acc : 1) : 0;
      const w = 2.5 + 2 * Math.sin(along * Math.PI / 6);
      return Math.abs(d - w) < 0.9 || d === 5 ? 1 : 0;
    }
  }
  return 0;
}

// Decoded custom frame, cached by data URL: {w, h, rgba}
let customFrame = {url: '', img: null};
async function customFramePixels(url) {
  if (customFrame.url === url) return customFrame.img;
  const im = await loadLocalImage(url);
  let px = null;
  if (im) {
    const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
    const x = c.getContext('2d', {willReadFrequently: true}); x.drawImage(im, 0, 0);
    px = {w: c.width, h: c.height, rgba: x.getImageData(0, 0, c.width, c.height).data};
  }
  customFrame = {url, img: px};
  return px;
}

// Draws the frame of this page into ink (W x H ink codes), clearing the band first.
async function applyFrame(ink, s, key) {
  const style = frameOf(s, key), T = frameThickness(s, key);
  if (!T) return;
  const pal = panelOf(s).palette;
  const hasAcc = pal.includes('red'), acc = inkCode('red');
  let img = null;
  if (style === 'custom') { img = await customFramePixels(s.frameImg); if (!img) return; }
  const palOpt = {palette: pal.map(inkCode), contrast: 0};
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const cx = Math.min(x, W - 1 - x), cy = Math.min(y, H - 1 - y), d = Math.min(cx, cy);
    if (d >= T) { x = W - 1 - T; continue; }      // jump over the inside of the row
    const i = y * W + x;
    if (!img) { ink[i] = framePixel(style, d, cx <= cy ? y : x, cx, cy, x, y, acc, hasAcc); continue; }
    // 9-slice: corners as they are, edges repeat their middle part
    const b = T, sx = x < b ? x : x >= W - b ? img.w - (W - x) : b + (x - b) % Math.max(1, img.w - 2 * b);
    const sy = y < b ? y : y >= H - b ? img.h - (H - y) : b + (y - b) % Math.max(1, img.h - 2 * b);
    const o = (sy * img.w + sx) * 4, r = img.rgba[o], g = img.rgba[o + 1], bl = img.rgba[o + 2];
    const th = (BAYER[4][y & 3][x & 3] + 0.5) / 16;
    if (img.rgba[o + 3] < 128) ink[i] = 0;
    else if (pal.length > 2) ink[i] = paletteInk(r, g, bl, palOpt, th);
    else ink[i] = 1 - (0.299 * r + 0.587 * g + 0.114 * bl) / 255 > th ? 1 : 0;
  }
}

// Upload: any image; the border is a third of its short side. Big images are reduced
// by a whole factor (pixel art stays sharp) so the border is at most 8 px.
async function uploadFrame(file) {
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const im = await loadLocalImage(url);
  if (!im || im.naturalWidth < 6 || im.naturalHeight < 6) throw new Error('image');
  const b0 = Math.floor(Math.min(im.naturalWidth, im.naturalHeight) / 3);
  const k = Math.max(1, Math.ceil(b0 / 8), Math.ceil(Math.max(im.naturalWidth, im.naturalHeight) / 96));
  const c = document.createElement('canvas');
  c.width = Math.max(6, Math.floor(im.naturalWidth / k)); c.height = Math.max(6, Math.floor(im.naturalHeight / k));
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.drawImage(im, 0, 0, c.width, c.height);
  state.frameImg = c.toDataURL('image/png');
  state.frameSlice = Math.max(2, Math.min(8, Math.floor(Math.min(c.width, c.height) / 3)));
  state.frame = 'custom';
}

// Picker: a corner of every frame on a page with the chosen header style, at 2x.
function buildFrameBox() {
  const fs = document.querySelector('fieldset[data-group="look"]');
  if (!fs || $('framebox')) return;
  const box = document.createElement('div'); box.className = 'trbox'; box.id = 'framebox';
  box.innerHTML = `<strong style="font-size:13px" id="frTitle"></strong><div class="frgrid" id="frGrid"></div>
    <div class="cur"><span class="muted" id="frInfo"></span>
    <label class="chk" style="cursor:pointer"><input type="file" id="frFile" accept="image/*" hidden><span id="frUp" class="btnlike"></span></label>
    <button type="button" id="frClr"></button></div>`;
  fs.querySelector('.grid').after(box);
  $('frFile').addEventListener('change', async ev => {
    const f = ev.target.files?.[0]; ev.target.value = '';
    if (!f) return;
    try { await uploadFrame(f); refreshFrameSelect(); renderFrameBox(); scheduleRender(); }
    catch { setStatus(t('tr_bad')); }
  });
  $('frClr').onclick = () => {
    state.frameImg = ''; state.frameSlice = 0;
    if (state.frame === 'custom') state.frame = 'none';
    refreshFrameSelect(); renderFrameBox(); scheduleRender();
  };
  renderFrameBox();
}

// The frame <select> lists "custom" only while an image is loaded.
function refreshFrameSelect() {
  const sel = document.querySelector('select[name=frame]');
  if (!sel) return;
  sel.replaceChildren(...frameOptions().map(([v, txt]) => new Option(txt, v)));
  sel.value = state.frame || 'none';
  renderPagesBox();
}

function renderFrameBox() {
  if (!$('framebox')) return;
  $('frTitle').textContent = t('fr_title');
  $('frUp').textContent = t('fr_upload');
  $('frClr').textContent = t('fr_clear');
  $('frClr').style.display = state.frameImg ? '' : 'none';
  $('frInfo').textContent = t(state.frameImg ? 'fr_custom_info' : 'fr_info');
  const keys = FRAME_KEYS.filter(k => k !== 'custom' || state.frameImg);
  const tiles = keys.map(k => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'frtile';
    b.setAttribute('aria-pressed', (state.frame || 'none') === k);
    const cv = document.createElement('canvas'); cv.width = 120; cv.height = 76;
    const cap = document.createElement('span'); cap.textContent = t('fr_' + k);
    b.append(cv, cap);
    b.onclick = () => {
      state.frame = k;
      const sel = document.querySelector('select[name=frame]'); if (sel) sel.value = k;
      renderFrameBox(); scheduleRender();
    };
    drawFrameThumb(cv, k);
    return b;
  });
  $('frGrid').replaceChildren(...tiles);

// Page keys in the order chosen in the Pages section (new pages go last); the
// Pokémon of the day always closes the rotation.
function orderedPages() {
  const all = Object.keys(PAGES).filter(k => k !== 'daily'), order = Array.isArray(state.pageOrder) ? state.pageOrder : [];
  return [...order.filter(k => all.includes(k)), ...all.filter(k => !order.includes(k))];
}
const activePages = () => [...orderedPages().filter(k => state['pg_' + k]), ...(state.pg_daily ? ['daily'] : [])];

// Classify every canvas pixel to an ink code: the pure marker colour of an ink the
// panel has (INKS[].css), else black or white by brightness.
function canvasToInk(ctx, palette) {
  const d = ctx.getImageData(0, 0, W, H).data;
  const ink = new Uint8Array(W * H);
  const hasRed = palette.includes('red');
  const marks = palette.map(inkCode).filter(c => c > 2).map(c => {
    const h = INKS[c].css; return [c, parseInt(h[1], 16) * 17, parseInt(h[2], 16) * 17, parseInt(h[3], 16) * 17];
  });
  for (let i = 0; i < W * H; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    let v = hasRed && r > 160 && g < 110 && b < 110 ? 2 : -1;
    for (let k = 0; v < 0 && k < marks.length; k++) {
      const m = marks[k];
      if (Math.abs(r - m[1]) < 60 && Math.abs(g - m[2]) < 60 && Math.abs(b - m[3]) < 60) v = m[0];
    }
    ink[i] = v > 0 ? v : (0.299 * r + 0.587 * g + 0.114 * b) < 128 ? 1 : 0;
  }
  return ink;
}

// Colour of a type chip on colour panels: the first ink of the list the panel has.
const TYPE_INK = {fire: ['orange', 'red'], water: ['blue'], grass: ['green'], electric: ['yellow'], ice: ['blue'],
  fighting: ['red'], poison: ['blue', 'red'], ground: ['orange', 'yellow'], flying: ['blue'], psychic: ['red'],
  bug: ['green', 'yellow'], rock: ['orange', 'yellow'], ghost: ['blue'], dragon: ['blue', 'red'], fairy: ['red']};
function typeFill(type, s, fallback) {
  if (!isColour(s)) return fallback;
  const name = (TYPE_INK[typeKey(type)] || []).find(n => hasInk(s, n));
  return name ? INKS[inkCode(name)].css : fallback;
}
const textOn = css => css === '#ff0' || css === '#f80' || css === '#0f0' ? BLACK : WHITE;   // light inks take black text

// s: data to draw (state, or state + a collection card); idx/total: page dots.
async function renderPage(key, s = state, idx, total, part = 0) {
  const hasRed = hasInk(s, 'red'), acc = accent(s);
  if (idx == null) {
    const plan = rotationPlan();
    total = plan.length;
    idx = key === 'daily' ? total - 1 : plan.findIndex(e => e.key === key && e.part === part && e.jobs.some(j => j.s === s || sameCard(j.s, s)));
  }
  if (part) s = {...s, _part: part};
  const page = PAGES[key];
  const work = document.createElement('canvas'); work.width = W; work.height = H;
  const ctx = work.getContext('2d', {willReadFrequently: true});
  const assets = page.prepare ? await page.prepare(s) : {blits: []};
  setFrameForChrome(frameThickness(s, key));
  chrome(ctx, s, d(key), idx, total, ...(page.header ? page.header(s, assets) : []));
  page.draw(ctx, s, acc, assets);
  const ink = canvasToInk(ctx, panelOf(s).palette);
  const opt = {hasRed, dither: s.dither, contrast: Number(s.contrast) || 0,
    palette: isColour(s) ? panelOf(s).palette.map(inkCode) : null};
  if (page.finish) page.finish(ink, s, opt, assets);
  for (const bl of assets?.blits || []) blitSprite(ink, bl.sp, ...bl.area, {...opt, valign: bl.valign || 'center', fit: bl.fit, icon: bl.icon, maxScale: bl.maxScale, gamma: bl.gamma, crisp: bl.crisp, scale: bl.scale});
  if (page.sprite) {
    const img = await getSprite(spriteUrl(s.style, s.dex, s.shiny));
    const sp = spritePixels(img);
    if (sp) blitSprite(ink, sp, ...page.spriteArea, opt);
  }
  await applyFrame(ink, s, key);
  ink.overlay = assets.overlay || null;
  return ink;
}

function showInk(ink) {
  const out = $('out').getContext('2d');
  const img = out.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const [r, g, b] = INKS[ink[i]].rgb;
    img.data.set([r, g, b, 255], i * 4);
  }
  out.putImageData(img, 0, 0);
}

// <codec> (extracted and run by tests/test_codec.py)
// DXF1: 12-byte header, then runs (0cccllll, llll=15 -> 16 + varint) and literals
// (1nnnnnnn + n+1 pixels packed at bpp bits, MSB first; n=127 -> 128 + varint). See include/frame_codec.h.
function encodeFrame(ink, w, h, bpp) {
  const n = w * h, out = [68, 88, 70, 49, w & 255, w >> 8, h & 255, h >> 8, bpp, 0, 0, 0];
  const minRun = Math.max(3, Math.ceil(16 / bpp) + 1);   // shorter runs are cheaper inside a literal
  const varint = v => { while (v > 127) { out.push((v & 127) | 128); v >>>= 7; } out.push(v); };
  let lit = [];
  const flush = () => {
    if (!lit.length) return;
    if (lit.length < 128) out.push(0x80 | (lit.length - 1));
    else { out.push(0xff); varint(lit.length - 128); }
    let acc = 0, bits = 0;
    for (const c of lit) { acc = ((acc << bpp) | c) & 0xfff; bits += bpp; while (bits >= 8) { out.push((acc >> (bits - 8)) & 255); bits -= 8; } }
    if (bits) out.push((acc << (8 - bits)) & 255);
    lit = [];
  };
  for (let i = 0; i < n;) {
    const c = ink[i];
    let j = i + 1;
    while (j < n && ink[j] === c) j++;
    const run = j - i;
    if (run >= minRun) {
      flush();
      if (run < 16) out.push((c << 4) | (run - 1));
      else { out.push((c << 4) | 15); varint(run - 16); }
    } else for (let k = 0; k < run; k++) lit.push(c);
    i = j;
  }
  flush();
  return new Uint8Array(out);
}
// </codec>

// Two raw 1-bit planes (black, red): the page format of firmware up to 1.4.0.
function pack(ink) {
  const buf = new Uint8Array(PLANE * 2);
  for (let i = 0; i < W * H; i++) {
    const v = ink[i];
    if (!v) continue;
    buf[(v === 1 ? 0 : PLANE) + (i >> 3)] |= 0x80 >> (i & 7);
  }
  return buf;
}

// ---------- more pages: countdown, move details, IV/EV chart, evolutions, Pokédex entry ----------
const teamPer = s => [2, 3].includes(Number(s.teamPer)) ? Number(s.teamPer) : 6;

// Team split over several pages: one row of 3 or 2 Pokémon with room for big sprites.
// Exact 2x when every sprite of the page fits its cell, otherwise one common size.
function drawTeamRow(ctx, s, acc, a) {
  const per = teamPer(s), mons = a.mons.slice((s._part || 0) * per, (s._part || 0) * per + per);
  const cw = 384 / per, top = 36, ah = 206;

  const twice = pix.every(sp => !sp || (sp.w * 2 <= cw - 4 && sp.h * 2 <= ah));
  mons.forEach((m, i) => {

// Digits drawn from the same strip the board uses (buildGlyphs), as scale x scale
// blocks: what the firmware redraws every midnight matches pixel for pixel
// (paintOverlay in src/main.cpp).
function digitRun(str) {
  const g = buildGlyphs(), n = g[2], sep = numSep();
  const idx = [...String(str)].map(ch => ch === sep ? 10 : ch >= '0' && ch <= '9' ? Number(ch) : -1).filter(k => k >= 0 && k < n);
  return {g, idx, width: idx.reduce((a, k) => a + g[3 + k], 0)};
}
function drawDigits(ctx, str, x0, y0, w, align, scale, color) {
  const {g, idx, width} = digitRun(str);
  const gw = g[0], gh = g[1], n = g[2], stride = Math.ceil(gw / 8);
  let x = align === 2 ? x0 + w - width * scale : align === 1 ? x0 + Math.floor((w - width * scale) / 2) : x0;
  ctx.fillStyle = color;
  for (const k of idx) {
    const base = 3 + n + k * gh * stride;
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
      if (!(g[base + gy * stride + (gx >> 3)] & (0x80 >> (gx & 7)))) continue;
      const px = x + (gx - 2) * scale, l = Math.max(px, x0), r = Math.min(px + scale, x0 + w);
      if (r > l) ctx.fillRect(l, y0 + gy * scale, r - l, scale);
    }
    x += g[3 + k] * scale;
  }
}

// Crisp 1-bit line (the canvas' own strokes are anti-aliased). dash: pixels on / off.
function line(ctx, x0, y0, x1, y1, color, thick = 1, dash = 0) {
  ctx.fillStyle = color;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, n = 0;
  for (;;) {
    if (!dash || Math.floor(n / dash) % 2 === 0) ctx.fillRect(x0 - (thick >> 1), y0 - (thick >> 1), thick, thick);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
    n++;
  }
}

// A move name typed in any language -> PokeAPI slug, through the name tables in pkx/.
async function moveSlug(name) {
  const key = String(name || '').trim().toLowerCase();
  if (!key) return '';
  const en = await pkxData('en').catch(() => null);
  if (en?.moves) for (const l of Object.keys(LANGS)) {
    const T = l === 'en' ? en : await pkxData(l).catch(() => null);
    const i = T?.moves ? T.moves.findIndex(m => m && m.toLowerCase() === key) : -1;
    if (i > 0 && en.moves[i]) return sdSlug(en.moves[i]);
  }
  return sdSlug(name);
}

// "31/31/31/31/31/31" -> six numbers (HP Atk Def SpA SpD Spe), or null.
const six = v => { const a = String(v ?? '').split(/[^0-9]+/).filter(Boolean).map(Number); return a.length === 6 ? a : null; };
const decimal = v => v.toFixed(1).replace('.', state.dispLang === 'en' ? '.' : ',');
const slugWords = v => String(v || '').replace(/-/g, ' ');

// How a species evolves from the previous stage, in a few words.
function evoMethod(det) {
  if (!det) return '';
  if (det.min_level) return `${d('lv')} ${det.min_level}`;
  if (det.item) return slugWords(det.item.name);
  if (det.trigger?.name === 'trade') return det.held_item ? `${d('evo_trade')} + ${slugWords(det.held_item.name)}` : d('evo_trade');
  if (det.min_happiness) return d('evo_friend');
  if (det.known_move) return slugWords(det.known_move.name);
  if (det.held_item) return slugWords(det.held_item.name);
  if (det.location) return slugWords(det.location.name);
  return slugWords(det.trigger?.name);
}

        text(ctx, up([typeName(s['mtype' + i]), cat ? d('cat_' + cat) : ''].filter(Boolean).join(' · ')), 30, y + 34, 8, true, BLACK, 'left', 204);
        ctx.fillStyle = BLACK; ctx.fillRect(242, y + 6, 1, 41);
        [['pow', m?.power], ['acc', m?.accuracy], ['pp', m?.pp]].forEach(([k, v], c) => {
          const cx = 268 + c * 48;
          text(ctx, up(d(k)), cx, y + 8, 8, true, acc, 'center');
          text(ctx, v != null ? String(v) : '—', cx, y + 24, 16, false, BLACK, 'center');
        });
      }
    },
  },
  radar: {
    draw(ctx, s, acc) {
      const ring = ['ps', 'att', 'dif', 'vel', 'dfsp', 'atsp'];      // clockwise from the top, as in the games
      const list = ['ps', 'att', 'dif', 'atsp', 'dfsp', 'vel'];      // order of the IV / EV fields
      const vals = ring.map(k => Number(s[k]) || 0), ivs = six(s.ivs), evs = six(s.evs);
      const cx = 118, cy = 168, R = 78, top = Math.max(...vals, 1);
      const pt = (i, f, r = R) => {
        const an = -Math.PI / 2 + i * Math.PI / 3;
        return [Math.round(cx + Math.cos(an) * r * f), Math.round(cy + Math.sin(an) * r * f)];
      };
      const poly = (fs, color, thick, dash) => fs.forEach((f, i) => line(ctx, ...pt(i, f), ...pt((i + 1) % 6, fs[(i + 1) % 6]), color, thick, dash));
      for (let i = 0; i < 6; i++) line(ctx, cx, cy, ...pt(i, 1), BLACK, 1, 2);
      poly(Array(6).fill(1), BLACK, 1);
      poly(Array(6).fill(0.5), BLACK, 1, 2);
      if (evs) poly(ring.map(k => Math.max(0.04, Math.min(1, evs[list.indexOf(k)] / 252))), acc, hasInk(s, 'red') ? 2 : 1, hasInk(s, 'red') ? 0 : 3);
      poly(vals.map(v => Math.max(0.06, v / top)), BLACK, 3);
      ring.forEach((k, i) => {
        const [lx, ly] = pt(i, 1, R + 20);
        text(ctx, up(d(k)), Math.max(26, lx), ly - 10, 8, true, BLACK, 'center');
        text(ctx, String(vals[i]), Math.max(26, lx), ly, 8, false, BLACK, 'center');
      });
      // table: stat, IV, EV
      const x = 244;
      text(ctx, 'IV', 338, 40, 8, true, acc, 'right');
      text(ctx, 'EV', 390, 40, 8, true, acc, 'right');
      list.forEach((k, i) => {
        const y = 54 + i * 34;
        text(ctx, up(d(k)), x, y, 8, true, BLACK);
        text(ctx, String(Number(s[k]) || 0), x, y + 10, 16, true, BLACK);
        text(ctx, ivs ? String(ivs[i]) : '—', 338, y + 10, 16, false, BLACK, 'right');
        text(ctx, evs ? String(evs[i]) : '—', 390, y + 10, 16, false, BLACK, 'right');
      });
      if (evs) text(ctx, `${up(d('total'))} EV ${evs.reduce((a, b) => a + b, 0)}`, 390, 266, 8, true, BLACK, 'right');
    },
  },
  evo: {
    async prepare(s) {
      const sp = await pj(`pokemon-species/${Number(s.dex)}`);
      const chain = (await pj(sp.evolution_chain.url)).chain;
      // the line through this species, continued along the first branch
      const find = (node, trail) => {
        const here = [...trail, node];
        if (node.species.name === sp.name) return here;
        for (const next of node.evolves_to) { const hit = find(next, here); if (hit) return hit; }
        return null;
      };
      let path = find(chain, []) || [chain];
      const branches = path[path.length - 1].evolves_to.length;
      while (path[path.length - 1].evolves_to.length) path.push(path[path.length - 1].evolves_to[0]);
      const at = path.findIndex(n => n.species.name === sp.name);
      if (path.length > 4) path = path.slice(Math.min(Math.max(0, at - 1), path.length - 4)).slice(0, 4);
      const stages = await Promise.all(path.map(async node => {
        const id = Number(node.species.url.match(/\/(\d+)\/?$/)[1]);
        const [img, name] = await Promise.all([getSprite(spriteUrl(s.style, id, false)).catch(() => null), monName(id, s.dispLang)]);
        return {id, img, name, method: evoMethod(node.evolution_details?.[0]), current: node.species.name === sp.name};
      }));
      return {stages, branches, blits: []};
    },
    draw(ctx, s, acc, a) {
      const n = a.stages.length, cw = 384 / n;
      if (a.branches > 1) text(ctx, `+${a.branches - 1}`, 390, 40, 8, true, acc, 'right');   // other branches not shown
      a.stages.forEach((st, i) => {
        const x = Math.round(8 + i * cw);
        let sp = null;
        try { sp = st.img && spritePixels(st.img); } catch { sp = null; }
        if (sp) a.blits.push({sp, area: [x + 4, 44, Math.round(cw - 8), 154], valign: 'bottom', fit: 'size'});
        ctx.fillStyle = BLACK; ctx.fillRect(x + 10, 200, Math.round(cw - 20), 1);
        text(ctx, up(st.name), x + cw / 2, 206, 8, true, BLACK, 'center', cw - 6);
        text(ctx, `#${String(st.id).padStart(4, '0')}`, x + cw / 2, 217, 8, false, BLACK, 'center');
        if (st.current) { ctx.fillStyle = acc; ctx.fillRect(x + 10, 229, Math.round(cw - 20), 3); }
        if (i > 0) {   // arrow on the boundary with the previous stage, how it evolves below
          const bx = x - 1;
          ctx.fillStyle = BLACK;
          for (let c = 0; c < 5; c++) ctx.fillRect(bx - 2 + c, 240 + c, 1, 9 - 2 * c);   // small right-pointing triangle
          wrapLines(up(st.method), 8, true, cw - 4).slice(0, 2).forEach((l, r) => text(ctx, l, bx, 258 + r * 11, 8, true, BLACK, 'center'));
        }
      });
    },
  },
  dexinfo: {
    sprite: true,
    spriteArea: [10, 36, 150, 132],
    async prepare(s) {
      const id = Number(s.dex), lang = state.dispLang;
      const [p, sp] = await Promise.all([pj(`pokemon/${id}`).catch(() => null), pj(`pokemon-species/${id}`).catch(() => null)]);
      return {p, sp, blits: [],
        genus: sp ? (sp.genera.find(g => g.language.name === lang) || sp.genera.find(g => g.language.name === 'en') || {}).genus || '' : '',
        flavor: sp ? pickFlavor(sp, s.style, lang) : ''};
    },
    draw(ctx, s, acc, a) {
      ctx.fillStyle = BLACK; ctx.fillRect(10, 170, 150, 2);
      const x = 172, w = 218;
      text(ctx, `#${String(s.dex).padStart(4, '0')}`, x, 40, 16, true, BLACK);
      wrapLines(up(a.genus), 8, true, w).slice(0, 2).forEach((l, i) => text(ctx, l, x, 62 + i * 11, 8, true, BLACK));
      field(ctx, d('height'), a.p ? `${decimal(a.p.height / 10)} m` : '', x, 90, 100, acc);
      field(ctx, d('weight'), a.p ? `${decimal(a.p.weight / 10)} kg` : '', x + 112, 90, 106, acc);
      field(ctx, d('egg'), a.sp ? a.sp.egg_groups.map(g => slugWords(g.name)).join(' / ') : '', x, 128, w, acc);
      const fl = up(a.flavor || d('flavor_none'));
      let lines = wrapLines(fl, 16, false, 372), px = 16, lh = 19;
      if (lines.length > 5) { lines = wrapLines(fl, 8, false, 372).slice(0, 9); px = 8; lh = 11; }
      const top = 180 + Math.max(0, Math.floor((102 - lines.length * lh) / 2));
      lines.forEach((l, i) => text(ctx, l, 14, top + i * lh, px, false, BLACK));
    },
  },
});

function buildTabs() {
  const pages = activePages();
  if (!pages.includes(previewPage)) previewPage = pages[0] || 'cover';
  const tabs = $('tabs'); tabs.innerHTML = '';
  for (const k of pages) {
    const parts = k === 'daily' ? 1 : pageParts(k);
    if (k === previewPage && previewPart >= parts) previewPart = 0;
    for (let p = 0; p < parts; p++) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = t('pg_' + k) + (parts > 1 ? ' ' + (p + 1) : ''); b.dataset.page = k;
      b.setAttribute('aria-pressed', k === previewPage && p === previewPart);
      b.onclick = () => { previewPage = k; previewPart = p; previewCard = null; buildTabs(); render(); };
      tabs.append(b);
    }
  }
}

// Display name for a list entry: a custom name wins; an empty or stock name (in any
// language) becomes the legend name in the display language; else the file name.
function autoRibbonName({name, file}, byFile, lang = state.dispLang) {
  const e = byFile.get(file);
  if (e && (!name || Object.keys(LANGS).some(l => displayName(e, l).toLowerCase() === name.toLowerCase())))
    return displayName(e, lang);
  return name || file.replace(/^.*\//, '').replace(/\.\w+$/, '').replace(/[_-]/g, ' ');
}
const isCustomName = ({name, file}, byFile) => !!name && autoRibbonName({name, file}, byFile) === name &&
  !(byFile.get(file) && Object.keys(LANGS).some(l => displayName(byFile.get(file), l).toLowerCase() === name.toLowerCase()));

// The chosen ribbons, in display order: icon + automatic name, rename/reorder/remove.
async function renderSelected() {
  const box = $('pkSel'); if (!box) return;
  const byFile = new Map((await loadLegend()).map(e => [e.png, e]));
  const lines = ribbonLines(), list = lines.map(parseRibbonLine);
  const h = document.createElement('h4'); h.textContent = t('sel_title', {n: list.length});
  const rows = list.map((r, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const img = document.createElement('img'); img.alt = '';
    if (r.file) img.src = iconSrc(r.file);
    const auto = autoRibbonName({name: '', file: r.file}, byFile);
    const inp = document.createElement('input'); inp.type = 'text';
    inp.value = isCustomName(r, byFile) ? r.name : '';
    inp.placeholder = r.file ? auto : r.name;
    inp.title = t('sel_rename', {n: auto});
    inp.addEventListener('change', () => {
      const v = inp.value.trim().replace(/\|/g, '');
      const next = ribbonLines();
      next[i] = r.file ? (v ? `${v} | ${r.file}` : r.file) : (v || r.name);
      setRibbonLines(next);
    });
    const btn = (label, title, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.title = title; b.onclick = fn; return b; };
    const move = d => () => { const next = ribbonLines(); const j = i + d; if (j < 0 || j >= next.length) return; [next[i], next[j]] = [next[j], next[i]]; setRibbonLines(next); };
    row.append(img, inp, btn('↑', t('up'), move(-1)), btn('↓', t('down'), move(1)),
      btn('✕', t('remove'), () => { const next = ribbonLines(); next.splice(i, 1); setRibbonLines(next); }));
    return row;
  });
  if (!rows.length) { const p = document.createElement('div'); p.className = 'empty'; p.textContent = t('sel_empty'); rows.push(p); }
  box.replaceChildren(h, ...rows);
}

async function renderPicker() {
  const res = $('pkR'); if (!res) return;
  renderSelected();
  const legend = await loadLegend();
  const q = $('pkQ').value.trim().toLowerCase(), kind = $('pkT').value, g = $('pkG').value, only = $('pkS').checked;
  const sel = selectedFiles();
  const hits = legend.filter(e => !e.dup &&
    (!kind || e.type === kind) && (!g || String(e.origin_gen) === g) && (!only || sel.has(e.png)) &&
    (!q || [e.name, ...Object.keys(LANGS).map(l => displayName(e, l)), e.title, e.description, e.symbol]
      .join(' ').toLowerCase().includes(q)));
  $('pkC').textContent = t('pk_count', {n: hits.length, s: sel.size});
  res.replaceChildren(...hits.slice(0, 120).map(e => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'it' + (sel.has(e.png) ? ' on' : '');
    b.title = e.description || e.name;
    const img = document.createElement('img'); img.src = iconSrc(e.png); img.alt = ''; img.loading = 'lazy';
    const lab = document.createElement('span');
    lab.textContent = displayName(e);
    const sm = document.createElement('small');
    const alt = displayName(e) !== e.name.replace(/ Ribbon\b/, '') ? ' · ' + e.name : '';
    sm.textContent = `${t(e.type === 'mark' ? 'k_mark' : 'k_ribbon')} · gen ${e.origin_gen} · ${t(e.web ? 'k_web' : 'k_own')}${alt}`;
    lab.append(sm); b.append(img, lab);

  }));
}

function toggleRibbon(e) {
  const lines = ribbonLines();
  const i = lines.findIndex(l => parseRibbonLine(l).file === e.png);
  if (i >= 0) lines.splice(i, 1); else lines.push(e.png);
  setRibbonLines(lines);
}

// ---------- Energy & updates: battery state, refresh, timing, Pokémon of the day schedule ----------
// Settings go to the board with "Send all pages", or alone with "Save to the display"
// (POST /api/settings: no page is sent again, the page on screen stays).

// Resting voltage -> charge of a 1S LiPo, linear between the points. Only a guide:
// the curve depends on the cell, its age and the load.
const LIPO = [[4200, 100], [4100, 90], [4000, 78], [3900, 63], [3800, 47], [3700, 30], [3600, 15], [3500, 6], [3400, 2], [3300, 0]];
function lipoPercent(mv) {
  if (mv >= LIPO[0][0]) return 100;
  for (let i = 1; i < LIPO.length; i++) {
    const [v1, p1] = LIPO[i - 1], [v0, p0] = LIPO[i];
    if (mv >= v0) return Math.round(p0 + (p1 - p0) * (mv - v0) / (v1 - v0));
  }
  return 0;
}

const dailySettings = (s = state) => ({dat: dailyAtOf(s), dev: dailyEveryOf(s), dsh: s.dailyShuffle ? 1 : 0});
const orderSettings = (s = state) => ({ord: s.orderShuffle ? 1 : 0, qi: Math.max(0, Math.round(Number(s.quietInterval) || 0))});

// The rotation settings that make sense without sending the pages again.
function settingsBody() {
  const plan = rotationPlan();
  const mins = k => Math.max(0, Math.round(Number((state.pageMin || {})[k]) || 0));
  const body = {interval: Math.max(0, Number(state.interval) || 0),
    sleep: state.sleep ? 1 : 0, awake: Math.max(1, Number(state.awake) || 3),
    tz: state.tz || DEFAULTS.tz, now: Math.floor(Date.now() / 1000),
    qf: state.quietOn ? minutesOf(state.quietFrom) : -1, qt: state.quietOn ? minutesOf(state.quietTo) : -1,
    flip: state.flip ? 1 : 0, dbl: Number(state.btnDouble) || 0, lng: Number(state.btnLong) || 0,
    batlow: Math.round((Number(state.batLow) || 3.5) * 1000), fullevery: Math.max(1, Math.round(Number(state.fullEvery) || 10)),
    ...dailySettings(), ...orderSettings()};
  // per-page minutes only when the pages on the board are the ones listed here
  if (boardMatches()) body.iv = plan.map(e => mins(e.key)).join(',');
  return new URLSearchParams(body);
}

// ---------- Showdown import ----------
// Export format: "Nick (Species) (M) @ Item", "Ability: X", "Level: 50", "Shiny: Yes",
// "EVs: 252 HP / 4 Def", "Modest Nature", "IVs: 0 Atk", "- Move" (one per line).
function parseShowdown(txt) {
  const lines = String(txt).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) throw new Error('—');
  let first = lines[0], item = '', gender = '', nick = '', species;
  const at = first.lastIndexOf(' @ ');
  if (at >= 0) { item = first.slice(at + 3).trim(); first = first.slice(0, at).trim(); }
  const g = first.match(/\s*\((M|F)\)$/);
  if (g) { gender = g[1]; first = first.slice(0, g.index).trim(); }
  const pm = first.match(/^(.*\S)\s*\(([^()]+)\)$/);
  if (pm) { nick = pm[1].trim(); species = pm[2].trim(); } else species = first;
  const set = {nick, species, item, gender, level: 100, shiny: false, ability: '', nature: '', evs: {}, ivs: {}, moves: []};
  for (const l of lines.slice(1)) {
    let m;
    if ((m = l.match(/^Ability:\s*(.+)$/i))) set.ability = m[1].trim();
    else if ((m = l.match(/^Level:\s*(\d+)/i))) set.level = Math.max(1, Math.min(100, +m[1]));
    else if (/^Shiny:\s*Yes/i.test(l)) set.shiny = true;
    else if ((m = l.match(/^(EVs|IVs):\s*(.+)$/i))) {
      for (const part of m[2].split('/')) {
        const q = part.trim().match(/^(\d+)\s+(HP|Atk|Def|SpA|SpD|Spe)$/i);
        if (q) set[m[1].toLowerCase()][q[2].toLowerCase()] = +q[1];
      }
    } else if ((m = l.match(/^([A-Za-z]+)\s+Nature$/i))) set.nature = m[1];
    else if ((m = l.match(/^[-~]\s*(.+)$/))) set.moves.push(m[1].replace(/\s*\[.*\]\s*$/, '').trim());
  }
  return set;
}
const sdSlug = n => String(n).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
  .replace(/♀/g, '-f').replace(/♂/g, '-m').replace(/[’'.:%]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
// Showdown stat key -> [PokeAPI stat name, DexFrame field]
const SD_STATS = {hp: ['hp', 'ps'], atk: ['attack', 'att'], def: ['defense', 'dif'], spa: ['special-attack', 'atsp'], spd: ['special-defense', 'dfsp'], spe: ['speed', 'vel']};
function calcStats(baseByName, set, natureJ) {
  const L = set.level, out = {};
  const inc = natureJ?.increased_stat?.name, dec = natureJ?.decreased_stat?.name;
  for (const [k, [name, field]] of Object.entries(SD_STATS)) {
    const B = baseByName[name] || 0, iv = set.ivs[k] ?? 31, ev = set.evs[k] ?? 0;
    const core = Math.floor((2 * B + iv + Math.floor(ev / 4)) * L / 100);
    if (k === 'hp') out[field] = B === 1 ? 1 : core + L + 10;       // Shedinja
    else out[field] = Math.floor((core + 5) * (name === inc && inc !== dec ? 1.1 : name === dec && inc !== dec ? 0.9 : 1));
  }
  return out;
}
async function importShowdown(txt) {
  const set = parseShowdown(txt), lang = state.dispLang;
  const p = await pj('pokemon/' + sdSlug(set.species));
  const opt = path => path ? pj(path).catch(() => null) : Promise.resolve(null);
  const [sp, ab, na, it, ...mv] = await Promise.all([
    pj(p.species.url), opt(set.ability && 'ability/' + sdSlug(set.ability)), opt(set.nature && 'nature/' + sdSlug(set.nature)),
    opt(set.item && 'item/' + sdSlug(set.item)), ...set.moves.slice(0, 4).map(m => opt('move/' + sdSlug(m)))]);
  const base = Object.fromEntries(p.stats.map(x => [x.stat.name, x.base_stat]));
  const types = p.types.sort((a, b) => a.slot - b.slot).map(x => typeKey(x.type.name));
  Object.assign(state, calcStats(base, set, na), {
    dex: sp.id, name: set.nick || locName(sp, lang), level: set.level, shiny: set.shiny,
    gender: set.gender || (sp.gender_rate === -1 ? '-' : state.gender),
    type1: types[0] || '', type2: types[1] || '',
    ability: ab ? locName(ab, lang) : set.ability, nature: na ? locName(na, lang) : set.nature,
    item: it ? locName(it, lang) : set.item,
    ivs: Object.keys(SD_STATS).map(k => set.ivs[k] ?? 31).join('/'), evs: Object.keys(SD_STATS).map(k => set.evs[k] ?? 0).join('/'),
  });
  for (let i = 0; i < 4; i++) {
    state['move' + i] = mv[i] ? locName(mv[i], lang) : (set.moves[i] || '');
    state['mtype' + i] = mv[i] ? typeKey(mv[i].type.name) : (set.moves[i] ? state['mtype' + i] : '');
  }
  return state.name;
}

// ---------- import from PKHeX files (.pk4 .pk5 .pk6 .pk7 .pk8 .pk9) ----------
// Formats, offsets, ribbon bits and game texts come from PKHeX (GPL-3.0) via
// tools/build_pkx_data.py -> pkx/core.json.gz, pkx/<lang>.json.gz.
const pkxCache = new Map();
function pkxData(name) {
  if (!pkxCache.has(name)) pkxCache.set(name, (async () => {
    if (EMBED?.pkx?.[name]) return EMBED.pkx[name];
    try {                               // the ESP32 serves name.json from name.json.gz (Content-Encoding)
      const r = await fetch(`pkx/${name}.json`);
      if (r.ok) return await r.json();
    } catch {}
    const r = await fetch(`pkx/${name}.json.gz`);     // plain static server: unpack here
    if (!r.ok) throw new Error(`pkx/${name}.json.gz: HTTP ${r.status}`);
    return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json();
  })().catch(e => { pkxCache.delete(name); throw e; }));
  return pkxCache.get(name);
}

// PKHeX ribbon property -> name in your legend.json (English), for the icons.
function pkxRibbonLegendName(prop, en) {
  let m;
  if ((m = prop.match(/^RibbonG([34])(Cool|Beauty|Cute|Smart|Tough)(Super|Hyper|Great|Ultra|Master)?$/)))
    return `${m[2]} Ribbon${m[3] ? ' ' + m[3] : ''} (${m[1] === '3' ? 'Hoenn' : 'Sinnoh'})`;
  if (prop === 'RibbonChampionG3') return 'Champion Ribbon';
  if (prop === 'RibbonChampionG6Hoenn') return 'Hoenn Champion Ribbon';
  return en;
}
const ribbonKey = s => String(s).toLowerCase().replace(/ribbon|mark/g, '').replace(/[^a-z0-9]/g, '');

// Every ribbon of the legend gets its name in each display language from PKHeX.
async function extendRibbonNames() {
  const [legend, en] = await Promise.all([loadLegend(), pkxData('en')]);
  if (!legend.length) return;
  const byKey = new Map();
  legend.forEach(e => { if (!byKey.has(ribbonKey(e.name))) byKey.set(ribbonKey(e.name), e); });
  for (const lang of Object.keys(LANGS)) {
    if (lang === 'en') continue;
    const tr = await pkxData(lang).catch(() => null);
    if (!tr) continue;
    RIBBON_NAMES[lang] ??= {};
    for (const [prop, enName] of Object.entries(en.ribbons)) {
      const e = byKey.get(ribbonKey(pkxRibbonLegendName(prop, enName)));
      if (e && tr.ribbons[prop] && !RIBBON_NAMES[lang][e.name]) RIBBON_NAMES[lang][e.name] = tr.ribbons[prop];
    }
  }
}

function pkxLocation(T, gen, loc, version) {
  // Gen 3-5 Pokémon moved forward with Poké Transfer (the label is blank in the Gen 5 text table)
  if (loc === 30001 && version <= 23) return {it: 'Pokétrasporto', en: 'Poké Transfer', es: 'Pokétransfer', fr: 'Poké Fret', de: 'Poképorter'}[state.dispLang] || 'Poké Transfer';
  const sets = T.locations['g' + Math.max(4, gen)] || {};
  const base = Object.keys(sets).map(Number).filter(b => b <= loc).sort((a, b) => b - a)[0];
  const name = base != null ? sets[base]?.[loc - base] : '';
  // English Gen 6+ texts read "Met in the Kanto region": drop the article
  return name && !/^[－-]+$/.test(name) ? name.replace(/^(the|an?) /i, '') : '';
}

async function importPkx(file, opts) {
  const fmt = (file.name.match(/\.(?:pk|ek)([4-9])$/i) || [])[1];
  if (!fmt) throw new Error(t('pk_ext'));
  const key = 'pk' + fmt, lang = state.dispLang;
  const [core, T, en, legend] = await Promise.all([pkxData('core'), pkxData(lang), pkxData('en'), loadLegend()]);
  const r = pkxRead(await file.arrayBuffer(), key, core);
  if (!r.species || r.species > 1025) throw new Error(t('pk_bad'));
  if (r.isEgg) throw new Error(t('pk_egg'));
  // base stats, types, move types and the EXP curve still come from PokeAPI
  const [p, sp] = await Promise.all([pj(`pokemon/${r.species}`), pj(`pokemon-species/${r.species}`)]);
  let level = r.level;
  if (!level) {
    const gr = await pj(sp.growth_rate.url);
    level = Math.max(...gr.levels.filter(l => l.experience <= r.exp).map(l => l.level), 1);
  }
  const mv = await Promise.all(r.moves.map(id => id ? pj(`move/${id}`).catch(() => null) : null));
  const STAT = ['ps', 'att', 'dif', 'vel', 'atsp', 'dfsp'];                 // file order: HP Atk Def Spe SpA SpD
  const API = ['hp', 'attack', 'defense', 'speed', 'special-attack', 'special-defense'];
  let stats = r.stats;
  if (!stats) {
    const base = Object.fromEntries(p.stats.map(x => [x.stat.name, x.base_stat]));
    const NAT = ['attack', 'defense', 'speed', 'special-attack', 'special-defense'];   // nature index = 5 * up + down
    const inc = NAT[Math.floor(r.statNature / 5)], dec = NAT[r.statNature % 5];
    stats = API.map((name, i) => {
      const core2 = Math.floor((2 * base[name] + r.ivs[i] + Math.floor(r.evs[i] / 4)) * level / 100);
      if (i === 0) return base[name] === 1 ? 1 : core2 + level + 10;
      return Math.floor((core2 + 5) * (inc === dec ? 1 : name === inc ? 1.1 : name === dec ? 0.9 : 1));
    });
  }
  const types = p.types.sort((a, b) => a.slot - b.slot).map(x => typeKey(x.type.name));
  const pad = n => String(n).padStart(2, '0');
  const upd = {
    dex: r.species, level, shiny: r.shiny,
    name: r.nicknamed && r.nickname ? r.nickname : T.species[r.species] || r.nickname,
    gender: ['M', 'F', '-'][r.gender] || '-',
    type1: types[0] || '', type2: types[1] || '',
    nature: T.natures[r.nature] || '', ability: T.abilities[r.ability] || '',
    item: r.item ? (T.items[r.item] || '') : '', language: PKX_LANG[r.lang] || '',
    ...Object.fromEntries(STAT.map((k, i) => [k, stats[i]])),
    ivs: [0, 1, 2, 4, 5, 3].map(i => r.ivs[i]).join('/'), evs: [0, 1, 2, 4, 5, 3].map(i => r.evs[i]).join('/'),   // HP Atk Def SpA SpD Spe
  };
  r.moves.forEach((id, i) => { upd['move' + i] = id ? (T.moves[id] || '') : ''; upd['mtype' + i] = mv[i] ? typeKey(mv[i].type.name) : ''; });
  if (opts.story) {
    const reg = PKX_REGION[r.version] || '';
    Object.assign(upd, {
      ot: r.otName, tid: r.gen >= 7 ? String((((r.sid << 16) | r.tid) >>> 0) % 1000000).padStart(6, '0') : String(r.tid).padStart(5, '0'),
      met: r.metDate ? `${pad(r.metDate[2])}/${pad(r.metDate[1])}/${r.metDate[0]}` : '',
      region: lang === 'en' ? (PKX_REGION_EN[reg] || reg) : reg,
      metPlace: pkxLocation(T, r.gen, r.metLoc, r.version),
      characteristic: r.characteristic != null ? (T.characteristics[r.characteristic] || '') : '',
      deposited: '',   // HOME data, not in the file
    });
  }
  let unmatched = 0;
  if (opts.ribbons) {
    const byKey = new Map();
    legend.forEach(e => { if (!byKey.has(ribbonKey(e.name))) byKey.set(ribbonKey(e.name), e); });
    upd.ribbons = r.ribbons.map(prop => {
      const e = byKey.get(ribbonKey(pkxRibbonLegendName(prop, en.ribbons[prop] || prop)));
      if (e) return e.png;
      unmatched++;
      return (T.ribbons[prop] || en.ribbons[prop] || prop).replace(/\|/g, '');
    }).join('\n');
  }
  Object.assign(state, upd);
  return {name: state.name, ribbons: r.ribbons.length, unmatched, fmt: key, game: T.games[r.version] || ''};
}

async function monName(id, lang = state.dispLang) {

}
let monIndexP = null;
function monIndex() {
  monIndexP ??= Promise.all(Object.keys(LANGS).map(l => pkxData(l).catch(() => null))).then(lists => {
    const out = [];
    for (let id = 1; id <= 1025; id++) {
      const names = lists.map(T => T?.species?.[id]).filter(Boolean);
      if (names.length) out.push({id, names});

const monPickers = [];

// cfg: {host, id, title(n), multi, max, get() -> [ids], set([ids]) }
function buildMonPicker(cfg) {

const monLabel = async id => `#${String(id).padStart(4, '0')} ${await monName(id, state.uiLang)}`;
async function renderMonPicker(cfg) {
  if (!cfg.box?.isConnected) return;
  const box = cfg.box, sel = cfg.get();
  if (cfg.multi) {
    const h = document.createElement('h4'); h.textContent = cfg.title(sel.length);
    const rows = await Promise.all(sel.map(async (id, i) => {
      const row = document.createElement('div'); row.className = 'row';
      const img = document.createElement('img'); img.alt = ''; img.src = pokeThumb(id);
      const lab = document.createElement('span'); lab.style.flex = '1'; lab.textContent = await monLabel(id);
      const btn = (txt, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.onclick = fn; return b; };
      const move = dlt => () => { const n = [...sel]; const j = i + dlt; if (j < 0 || j >= n.length) return; [n[i], n[j]] = [n[j], n[i]]; cfg.set(n); };
      row.append(img, lab, btn('↑', move(-1)), btn('↓', move(1)), btn('✕', () => cfg.set(sel.filter((_, k) => k !== i))));
      return row;
    }));
    if (!rows.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('team_empty'); rows.push(e); }
    box.querySelector('.sel').replaceChildren(h, ...rows);
  }
  let list;

  const q = box.querySelector('input').value.trim().toLowerCase(), g = Number(box.querySelector('select').value);
  const num = /^#?\d+$/.test(q) ? Number(q.replace('#', '')) : null;
  const hits = list.filter(e => (!g || genOf(e.id) === g) &&
    (!q || (num != null ? String(e.id).startsWith(String(num)) : e.names.some(n => n.toLowerCase().includes(q)))));
  box.querySelector('.count').textContent = cfg.multi ? t('mon_count_multi', {n: hits.length, m: cfg.max}) : t('mon_count', {n: hits.length});
  box.querySelector('.res').replaceChildren(...hits.slice(0, 120).map(e => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'it' + (sel.includes(e.id) ? ' on' : '');
    const img = document.createElement('img'); img.src = pokeThumb(e.id); img.alt = ''; img.loading = 'lazy';
    const lab = document.createElement('span');
    const name = e.names[Object.keys(LANGS).indexOf(state.uiLang)] || e.names[0];
    lab.textContent = name;
    const sm = document.createElement('small'); sm.textContent = `#${String(e.id).padStart(4, '0')} · gen ${genOf(e.id)}`;
    lab.append(sm); b.append(img, lab);
    b.onclick = () => {
      if (!cfg.multi) return cfg.set([e.id]);
      const cur = cfg.get();
      if (cur.includes(e.id)) cfg.set(cur.filter(x => x !== e.id));
      else if (cur.length < cfg.max) cfg.set([...cur, e.id]);
    };
    return b;
  }));
}

// ---------- MD5 (RFC 1321), for the firmware upload check ----------
// The board compares it with the image it wrote (Update.setMD5), so a file damaged on
// the way is refused instead of booted. Not used for anything secret.
function md5Hex(bytes) {
  const K = new Uint32Array(64), S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 2 ** 32) >>> 0;
  const n = bytes.length, total = ((n + 8) >>> 6) + 1 << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[n] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, (n * 8) >>> 0, true);
  dv.setUint32(total - 4, Math.floor(n / 0x20000000), true);
  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
  const M = new Uint32Array(16);
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) M[i] = dv.getUint32(off + i * 4, true);
    let a = a0, b = b0, c = c0, d = d0;
    for (let i = 0; i < 64; i++) {
      let f, g;
      if (i < 16) { f = (b & c) | (~b & d); g = i; }
      else if (i < 32) { f = (d & b) | (~d & c); g = (5 * i + 1) & 15; }
      else if (i < 48) { f = b ^ c ^ d; g = (3 * i + 5) & 15; }
      else { f = c ^ (b | ~d); g = (7 * i) & 15; }
      const s = S[(i >> 4) * 4 + (i & 3)];
      const x = (a + f + K[i] + M[g]) >>> 0;
      a = d; d = c; c = b;
      b = (b + ((x << s) | (x >>> (32 - s)))) >>> 0;
    }
    a0 = (a0 + a) >>> 0; b0 = (b0 + b) >>> 0; c0 = (c0 + c) >>> 0; d0 = (d0 + d) >>> 0;
  }
  return [a0, b0, c0, d0].map(v => [0, 8, 16, 24].map(k => ((v >>> k) & 255).toString(16).padStart(2, '0')).join('')).join('');
}

// Text files of the web UI go to the board gzipped (it serves x.gz for x): about a
// quarter of the space. Browsers without CompressionStream send them as they are.
const GZIP_EXT = /\.(html|css|js|ttf|json|svg)$/i;
async function maybeGzip(file, rel) {
  if (!GZIP_EXT.test(rel) || typeof CompressionStream === 'undefined') return {file, rel};
  const gz = await new Response(file.stream().pipeThrough(new CompressionStream('gzip'))).blob();
  return {file: new File([gz], file.name + '.gz'), rel: rel + '.gz'};
}
// ---------- system: firmware / web UI update, key ----------
function xhrUpload(url, file, field, onProgress) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(), fd = new FormData();
    fd.append(field, file, file.name);
    x.open('POST', url);
    if (onProgress) x.upload.onprogress = e => onProgress(e.loaded / (e.total || 1));
    x.onload = () => x.status < 300 ? res(x.responseText)
      : rej(new Error(x.status === 403 ? t('sy_key_bad') : `HTTP ${x.status} ${x.responseText}`));
    x.onerror = () => rej(new Error('network'));
    x.send(fd);
  });
}

// Uploaded image -> cropped, block-averaged to at most 96px, stored as a PNG data URL
// (small enough to live in the saved state on the ESP32).
async function onTrainerUpload(ev) {
  const f = ev.target.files?.[0]; ev.target.value = '';
  if (!f) return;
  try {
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
    const img = await loadLocalImage(url);
    const sp = img && spritePixels(img);
    if (!sp) throw new Error();
    const fp = fitPixels(sp, 96);
    const c = document.createElement('canvas'); c.width = fp.w; c.height = fp.h;
    const x = c.getContext('2d'), id = x.createImageData(fp.w, fp.h);
    for (let yy = 0; yy < fp.h; yy++) for (let xx = 0; xx < fp.w; xx++) id.data.set(fp.at(xx, yy), (yy * fp.w + xx) * 4);
    x.putImageData(id, 0, 0);

    renderTrainerPicker(); scheduleRender();
  } catch { setStatus(t('tr_bad')); }
}
