; DexFrame — HexLions
; One build per panel (definitions in include/panel.h):
;   pio run -e bw   -t upload   -> 4.2" black/white             (GDEY042T81)
;   pio run -e bwr  -t upload   -> 4.2" black/white/red         (GDEY042Z98)
;   pio run -e bwry -t upload   -> 4.2" black/white/red/yellow  (GDEY0420F51, experimental)
;   pio run -e bw  -t uploadfs  -> web UI (data/) to LittleFS (wipes pages and data!)
; Later updates go over Wi-Fi: System section of the web UI, or http://dexframe.local/setup

[platformio]
default_envs = bw

[env]
platform = espressif32@^6.9.0   ; Arduino core 2.0.x
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.11.9

[env:bw]
build_flags = -DPANEL_BW

[env:bwr]
build_flags = -DPANEL_BWR

[env:bwry]
build_flags = -DPANEL_BWRY
