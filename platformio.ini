; DexFrame — HexLions
; Two builds, one per panel variant:
;   pio run -e bw  -t upload    -> 4.2" black/white      (GDEY042T81, SSD1683)
;   pio run -e bwr -t upload    -> 4.2" black/white/red  (GDEY042Z98, SSD1683)
;   pio run -e bw  -t uploadfs  -> web UI (data/) to LittleFS (wipes pages and data!)
; Later updates go over Wi-Fi: System section of the web UI, or http://dexframe.local/setup

[platformio]
default_envs = bw

[env]
platform = espressif32@^6.9.0   ; Arduino core 2.0.x
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    zinggjm/GxEPD2@^1.5.9
    adafruit/Adafruit GFX Library@^1.11.9

[env:bw]
build_flags = -DEPD_BW

[env:bwr]
build_flags = -DEPD_BWR
