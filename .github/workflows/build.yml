name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach the binaries to a release when a v* tag is pushed

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Web UI built from web/ is up to date
        run: python tools/build_ui.py --check
      - name: Frame codec (web UI encoder against the firmware decoder)
        run: python tests/test_codec.py
      - name: Rotation engine (pools, shuffled order)
        run: python tests/test_rotation.py
      - name: Pokémon of the day (web UI schedule against the firmware)
        run: python tests/test_daily.py
      - name: Push tool (frames from pictures and text)
        run: |
          pip install pillow
          python tests/test_push.py
      - name: Web UI against a fake board, every panel type
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python tests/test_ui.py

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        panel: [bw, bwr, bwry, spectra73]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool==4.8.1"
      - name: Build firmware and the web UI image
        run: |
          pio run -e ${{ matrix.panel }}
          pio run -e ${{ matrix.panel }} -t buildfs
      - name: Package
        run: |
          python tools/package_release.py ${{ matrix.panel }} --build .pio/build/${{ matrix.panel }} \
            --fs .pio/build/${{ matrix.panel }}/littlefs.bin \
            --boot-app0 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dexframe-${{ matrix.panel }}
          path: dist/*.bin

  # Web installer (ESP Web Tools): built on every run, published to GitHub Pages on v* tags.
  # Needs Settings -> Pages -> Source: "GitHub Actions" in the repository.
  installer:
    needs: [tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the installer site
        run: |
          npm pack esp-web-tools@10.4.0
          tar xzf esp-web-tools-10.4.0.tgz
          VERSION=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' src/main.cpp)
          python3 tools/build_installer.py --dist dist --ewt package/dist/web --version "$VERSION" --out site
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: startsWith(github.ref, 'refs/tags/v')

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
