name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach the binaries to a release when a v* tag is pushed

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool==4.8.1"
      - name: Build firmware (B/W and B/W/R) and the web UI image
        run: |
          pio run -e bw -e bwr
          pio run -e bw -t buildfs
      - name: Package
        run: |
          BOOT_APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          for env in bw bwr; do
            python tools/package_release.py "$env" --build ".pio/build/$env" \
              --fs .pio/build/bw/littlefs.bin --boot-app0 "$BOOT_APP0" --out dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dexframe-firmware
          path: dist/*.bin
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
